apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: exchange-rate-update-agent
  version: 1.0.0

type: agent

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

requires:
  - name: currency-exchange-rate-mcp
    kind: mcp-server
    ordId: customer.mcpbuilder.s4:apiResource:currency_exchange_rate_MCP:v1
